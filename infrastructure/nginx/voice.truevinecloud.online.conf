# Nginx configuration for voice.truevinecloud.online
# Super Admin is exposed at /admin with the existing Next.js basePath.
#
# Security controls:
#   - Port 3002 (admin app) is NOT exposed directly; Nginx proxies /admin.
#   - Rate limiting on authentication endpoints.
#   - Security headers (HSTS, X-Frame-Options, etc.).
#   - HTTPS enforced (HTTP redirects to HTTPS).
#   - Microphone access preserved for voice functionality.
#
# Apply as root:
#   sudo cp this-file /etc/nginx/sites-available/voice.truevinecloud.online
#   sudo nginx -t
#   sudo systemctl reload nginx

# Rate limit zone for admin authentication (10 req/min per IP)
limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=10r/m;

server {
    listen 80;
    listen 443 ssl;
    server_name voice.truevinecloud.online;

    ssl_certificate /etc/letsencrypt/live/truevinecloud-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truevinecloud-web/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # Security headers (microphone NOT disabled — voice functionality requires it)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ROUTE 1: Customer Frontend Web (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ROUTE 2: Super Admin (Port 3002) — Next.js basePath /admin
    # Uses ^~ to prevent regex locations from overriding this prefix match.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit on admin sign-in (brute-force protection)
    location = /admin/api/auth/sign-in {
        limit_req zone=admin_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ROUTE 3: Core API (Port 3000 — web app proxies to API on 3001)
    # PRESERVE existing routing: /api/* goes to web app (port 3000), NOT directly to API (3001).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ROUTE 4: System Health Check (Port 3001 — API directly)
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
