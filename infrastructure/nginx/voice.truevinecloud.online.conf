# Nginx configuration for voice.truevinecloud.online ONLY.
# Admin is served exclusively on the approved dedicated hostname
# admin.voice.truevinecloud.online (see admin.voice.truevinecloud.online.conf),
# behind its IP allowlist. Do NOT copy this file over that virtual host or
# remove its allow/deny rules.
#
# Security controls:
#   - /admin is blocked on the customer host; no admin proxy exists here.
#   - Security headers (HSTS, X-Frame-Options, etc.).
#   - HTTPS enforced (HTTP redirects to HTTPS).
#   - Microphone access preserved for voice functionality.
#
# Apply as root to the CUSTOMER host only (never to the Admin virtual host):
#   sudo cp this-file /etc/nginx/sites-available/voice.truevinecloud.online
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    listen 443 ssl;
    server_name voice.truevinecloud.online;

    ssl_certificate /etc/letsencrypt/live/truevinecloud-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/truevinecloud-web/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # Security headers (microphone NOT disabled — voice functionality requires it)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ROUTE 1: Customer Frontend Web (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ROUTE 2: Admin is NOT served on the customer hostname.
    # Admin lives only on admin.voice.truevinecloud.online behind its approved
    # IP allowlist. The ^~ match prevents any regex location from reviving it.
    location ^~ /admin {
        return 404;
    }

    # ROUTE 3: Core API (Port 3000 — web app proxies to API on 3001)
    # PRESERVE existing routing: /api/* goes to web app (port 3000), NOT directly to API (3001).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ROUTE 4: System Health Check (Port 3001 — API directly)
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
