# Nginx configuration for the approved dedicated Admin portal:
#   https://admin.voice.truevinecloud.online/admin
#
# This file is the checked-in contract for the restricted Admin virtual host.
# Never copy the customer template over this file; never remove the allowlist.
# It is separate from voice.truevinecloud.online.conf on purpose.
#
# Preserved security controls:
#   - Dedicated Admin hostname; /admin is not served on the customer hostname.
#   - Only the approved operator address 102.209.111.186/32 is allowed.
#   - deny all rejects every other IPv4 address and every IPv6 address.
#   - Client-supplied forwarding headers are rejected, so the source address
#     cannot be spoofed through X-Forwarded-* / X-Real-IP / Forwarded.
#   - Certbot continues to own HTTPS certificate renewal; no key material is
#     stored here and the HTTP server block is retained for renewal/redirect.
#   - The admin app is reached only on loopback 127.0.0.1:3002; no application
#     port is listened on publicly by this virtual host.
#   - Cache-Control: no-store is forced on proxied Admin API responses.
#
# Apply only as a separately reviewed change:
#   sudo cp this-file /etc/nginx/sites-available/admin.voice.truevinecloud.online
#   sudo ln -s /etc/nginx/sites-available/admin.voice.truevinecloud.online /etc/nginx/sites-enabled/admin.voice.truevinecloud.online
#   sudo nginx -t
#   sudo systemctl reload nginx

# Rate limit zone for admin authentication (10 req/min per IP).
# Defined here only, so enabling both virtual hosts does not duplicate the zone.
limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=10r/m;

server {
    listen 80;
    server_name admin.voice.truevinecloud.online;

    # Kept for certificate renewal (HTTP-01) and HTTPS redirection. No admin
    # content is served over HTTP.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.voice.truevinecloud.online;

    # Certbot-managed paths; certificate renewal configuration is unchanged.
    ssl_certificate /etc/letsencrypt/live/admin.voice.truevinecloud.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.voice.truevinecloud.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Approved operator address. "deny all" covers every other IPv4 address and
    # all IPv6 addresses; there is deliberately no IPv6 allow rule.
    allow 102.209.111.186/32;
    deny all;

    # Reject untrusted client-supplied forwarding headers before proxying.
    # No set_real_ip_from/real_ip_header is configured: $remote_addr is the
    # only accepted source address.
    if ($http_x_forwarded_for) { return 403; }
    if ($http_x_forwarded_proto) { return 403; }
    if ($http_x_real_ip) { return 403; }
    if ($http_x_forwarded_host) { return 403; }
    if ($http_forwarded) { return 403; }

    # Enforce no-store at the edge as well as in the admin API proxy, including
    # on error responses. Hide any upstream Cache-Control before adding ours.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js admin app (basePath /admin) on loopback only. Uses ^~ so a regex
    # location cannot override the restricted prefix match.
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit on admin sign-in (brute-force protection).
    location = /admin/api/auth/sign-in {
        limit_req zone=admin_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
