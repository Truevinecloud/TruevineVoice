name: PostgreSQL restore integration

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/restore-integration.yml'
      - 'infrastructure/scripts/*db-verify*'
      - 'infrastructure/scripts/*restore-integration*'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/restore-integration.yml'
      - 'infrastructure/scripts/*db-verify*'
      - 'infrastructure/scripts/*restore-integration*'
      - 'package.json'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run ci:setup-npm
      - run: npm ci
      - name: Check integration safety contracts
        run: npm run test:restore-integration:checks
      - name: Run Docker stub regressions
        run: npm run test:db-verify
      - name: Verify real PostgreSQL restores and resource cleanup
        run: npm run test:restore-integration
      - name: Remove only resources from this isolated integration run
        if: always()
        run: npm run test:restore-integration -- --cleanup
