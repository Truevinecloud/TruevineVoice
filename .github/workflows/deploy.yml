name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: truevinevoice-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOYMENT_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Verify CI gates and current main
        env:
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import {assertCiJobs} from "./infrastructure/scripts/verify-deployment.mjs";
            const {jobs} = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/jobs.json"));
            assertCiJobs(jobs);
          '
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$DEPLOY_SHA" ]; then
            echo "Superseded commit; deployment skipped"
            echo "DEPLOY_CURRENT=false" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_CURRENT=true" >> "$GITHUB_ENV"
          fi

      - name: Build and activate isolated release
        if: env.DEPLOY_CURRENT == 'true'
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test "$SSH_HOST" = '169.58.162.143'
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] && test "$SSH_USER" != root
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          opts=(-i "$RUNNER_TEMP/deploy-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" -o ConnectTimeout=20)
          destination="$SSH_USER@$SSH_HOST"
          incoming="/var/www/TruevineVoice/incoming/$DEPLOY_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "mkdir -m 750 '$incoming'"
          git archive "$DEPLOY_SHA" | ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "tar -x -C '$incoming'"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "export PATH=/opt/truevine-runtime/bin:/usr/local/bin:/usr/bin:/bin; cd '$incoming' && npm run deploy:release -- '$DEPLOY_SHA'"
