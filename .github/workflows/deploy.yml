name: Production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character main commit approved for production
        required: true
        type: string
      authorize_production:
        description: Explicitly authorize deployment of the exact release_sha after reviewing release approvals
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: truevinevoice-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOYMENT_READY == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.authorize_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      # The only deployable source is the operator-pinned full SHA.
      DEPLOY_SHA: ${{ inputs.release_sha }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact release SHA, CI gates and current main
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          }
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$RELEASE_SHA" != "$checked_out_sha" || "$RELEASE_SHA" != "$DEPLOY_SHA" ]]; then
            echo "release_sha must equal the checked-out and deployment commit" >&2
            exit 1
          fi

          # Only a completed successful main-push CI run for release_sha can
          # authorize deployment; all four required jobs are asserted below.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          ci_run=$(node --input-type=module -e '
            import fs from "node:fs";
            import {selectSuccessfulCiRun} from "./infrastructure/scripts/verify-deployment.mjs";
            const {workflow_runs} = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ci-runs.json"));
            process.stdout.write(String(selectSuccessfulCiRun(workflow_runs, process.env.GITHUB_REPOSITORY, process.env.RELEASE_SHA)));
          ')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import {assertCiJobs} from "./infrastructure/scripts/verify-deployment.mjs";
            const {jobs} = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/jobs.json"));
            assertCiJobs(jobs);
          '
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$RELEASE_SHA" ]; then
            echo "release_sha is no longer the exact tip of main; deployment refused" >&2
            exit 1
          fi

      - name: Build and activate isolated release
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test "$SSH_HOST" = '169.58.162.143'
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] && test "$SSH_USER" != root
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          opts=(-i "$RUNNER_TEMP/deploy-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" -o ConnectTimeout=20)
          destination="$SSH_USER@$SSH_HOST"
          incoming="/var/www/TruevineVoice/incoming/$DEPLOY_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "mkdir -m 750 '$incoming'"
          git archive "$DEPLOY_SHA" | ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "tar -x -C '$incoming'"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "export PATH=/opt/truevine-runtime/bin:/usr/local/bin:/usr/bin:/bin; cd '$incoming' && npm run deploy:release -- '$DEPLOY_SHA'"
