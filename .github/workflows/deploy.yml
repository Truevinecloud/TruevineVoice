name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Lets an operator redeploy the current main commit from the Actions tab.
  # This adds a trigger, not a way around the gates: the selected commit must
  # still have completed the whole CI workflow successfully, and the workflow
  # still refuses a commit that is not the tip of main.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: truevinevoice-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOYMENT_READY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      # Automatic runs deploy the commit the CI run tested. A manual run has no
      # `workflow_run` payload, so it deploys the commit behind the ref the
      # operator selected (main gives the current main SHA).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      EVENT_CI_RUN: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Verify CI gates and current main
        run: |
          set -euo pipefail
          # Automatic runs carry the CI run id. A manual run resolves the CI run
          # for the selected commit, accepting only a completed successful push
          # run from this repository, and then verifies the same four gates.
          if [ -n "${EVENT_CI_RUN:-}" ]; then
            ci_run="$EVENT_CI_RUN"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&per_page=100" \
              > "$RUNNER_TEMP/ci-runs.json"
            ci_run=$(node --input-type=module -e '
              import fs from "node:fs";
              import {selectSuccessfulCiRun} from "./infrastructure/scripts/verify-deployment.mjs";
              const {workflow_runs} = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ci-runs.json"));
              process.stdout.write(String(selectSuccessfulCiRun(workflow_runs, process.env.GITHUB_REPOSITORY)));
            ')
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import {assertCiJobs} from "./infrastructure/scripts/verify-deployment.mjs";
            const {jobs} = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/jobs.json"));
            assertCiJobs(jobs);
          '
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$DEPLOY_SHA" ]; then
            echo "Superseded commit; deployment skipped"
            echo "DEPLOY_CURRENT=false" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_CURRENT=true" >> "$GITHUB_ENV"
          fi

      - name: Build and activate isolated release
        if: env.DEPLOY_CURRENT == 'true'
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          test "$SSH_HOST" = '169.58.162.143'
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] && test "$SSH_USER" != root
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          opts=(-i "$RUNNER_TEMP/deploy-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts" -o ConnectTimeout=20)
          destination="$SSH_USER@$SSH_HOST"
          incoming="/var/www/TruevineVoice/incoming/$DEPLOY_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "mkdir -m 750 '$incoming'"
          git archive "$DEPLOY_SHA" | ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "tar -x -C '$incoming'"
          ssh "${opts[@]}" -p "$SSH_PORT" "$destination" "export PATH=/opt/truevine-runtime/bin:/usr/local/bin:/usr/bin:/bin; cd '$incoming' && npm run deploy:release -- '$DEPLOY_SHA'"
