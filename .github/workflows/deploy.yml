name: TruevineVoice CI/CD Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: truevinevoice-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy verified commit to Contabo VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -Eeuo pipefail

            APP_DIR=/var/www/TruevineVoice
            cd "$APP_DIR"

            test -d .git || { echo "ERROR: Git checkout missing"; exit 1; }
            test -f .env || { echo "ERROR: Production .env missing"; exit 1; }
            test -n "${DEPLOY_SHA:-}" || { echo "ERROR: Deployment commit missing"; exit 1; }

            echo "Previous checkout: $(git rev-parse HEAD)"
            echo "Deploying commit: $DEPLOY_SHA"

            git fetch origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"

            npm install --engine-strict=false
            npm run build
            npm run prisma:migrate:deploy

            if pm2 describe truevine-api >/dev/null 2>&1; then
              NODE_ENV=production pm2 reload truevine-api --update-env
            else
              NODE_ENV=production pm2 start "$APP_DIR/apps/api/dist/main.js" --name truevine-api --cwd "$APP_DIR"
            fi

            if pm2 describe truevine-worker >/dev/null 2>&1; then
              NODE_ENV=production pm2 reload truevine-worker --update-env
            else
              NODE_ENV=production pm2 start "$APP_DIR/apps/worker/dist/main.js" --name truevine-worker --cwd "$APP_DIR"
            fi

            if pm2 describe truevine-web >/dev/null 2>&1; then
              NODE_ENV=production pm2 reload truevine-web --update-env
            else
              NODE_ENV=production pm2 start npm --name truevine-web --cwd "$APP_DIR/apps/web" -- run start -- --port=3000
            fi

            if pm2 describe truevine-admin >/dev/null 2>&1; then
              NODE_ENV=production pm2 reload truevine-admin --update-env
            else
              NODE_ENV=production pm2 start npm --name truevine-admin --cwd "$APP_DIR/apps/admin" -- run start -- --port=3002
            fi

            wait_for_url() {
              url="$1"
              attempt=1
              while [ "$attempt" -le 30 ]; do
                if curl --silent --show-error --fail "$url" >/dev/null; then
                  echo "PASS: $url"
                  return 0
                fi
                sleep 2
                attempt=$((attempt + 1))
              done
              echo "FAIL: $url" >&2
              return 1
            }

            wait_for_url http://127.0.0.1:3001/health
            wait_for_url http://127.0.0.1:3000/
            wait_for_url http://127.0.0.1:3002/admin

            # Validate existing Nginx configuration; never rewrite or restart it here.
            nginx -t
            wait_for_url https://voice.truevinecloud.online/health
            wait_for_url https://voice.truevinecloud.online/
            wait_for_url https://voice.truevinecloud.online/admin

            pm2 save --force
            echo "Deployment succeeded: $(git rev-parse HEAD)"
