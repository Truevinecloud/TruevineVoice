name: TruevineVoice CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code Layers
        uses: actions/checkout@v4

      - name: Execute Secure Remote SSH Pipeline Sequence
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/TruevineVoice
            
            # Sync codebase from GitHub securely
            if [ ! -d ".git" ]; then
              git clone git@github.com:Truevinecloud/TruevineVoice.git .
            else
              git fetch --all
              git reset --hard origin/main
            fi
            
            npm install --engine-strict=false
            npm run build
            
            # --- CONSOLIDATE ALL SYSTEM APP ROUTES UNDER ONE VOICE SUBDOMAIN ---
            rm -f /etc/nginx/sites-enabled/*
            rm -f /etc/nginx/sites-available/*
            
            cat << 'EOF' > /etc/nginx/sites-available/voice.truevinecloud.online
            server {
                listen 80;
                listen 443 ssl;
                server_name voice.truevinecloud.online;

                ssl_certificate /etc/letsencrypt/live/truevinecloud-web/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/truevinecloud-web/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                if ($scheme = http) {
                    return 301 https://$host$request_uri;
                }

                # ROUTE 1: Main Customer Web Interface (Port 3000) -> Handles Login & Basic Profiles
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }

                # ROUTE 2: Platform Admin Dashboard (Port 3002) -> Handles Higher Roles & Permissions
                location /admin {
                    proxy_pass http://127.0.0.1:3002;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }

                # ROUTE 3: NestJS Backend API Core Server Gateway (Port 3001)
                location /api/ {
                    proxy_pass http://127.0.0;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }

                # ROUTE 4: NestJS API Health diagnostics endpoint route (Port 3001)
                location /health {
                    proxy_pass http://127.0.0health;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
            }
            EOF
            
            # Activate configuration and deploy database schema updates
            ln -s /etc/nginx/sites-available/voice.truevinecloud.online /etc/nginx/sites-enabled/
            npm run prisma:migrate:deploy
            
            # Orchestrate PM2 lifecycle daemons for all apps
            API_PATH=$(find . -name "main.js" | grep -v "node_modules" | grep "api" | head -n 1)
            WORKER_PATH=$(find . -name "main.js" | grep -v "node_modules" | grep "worker" | head -n 1)
            
            NODE_ENV=production pm2 describe truevine-api > /dev/null && NODE_ENV=production pm2 reload truevine-api --update-env || NODE_ENV=production pm2 start "$API_PATH" --name "truevine-api"
            NODE_ENV=production pm2 describe truevine-worker > /dev/null && NODE_ENV=production pm2 reload truevine-worker --update-env || NODE_ENV=production pm2 start "$WORKER_PATH" --name "truevine-worker"
            
            NODE_ENV=production pm2 describe truevine-web > /dev/null && NODE_ENV=production pm2 reload truevine-web --update-env || NODE_ENV=production pm2 start npm --name "truevine-web" --cwd "/var/www/TruevineVoice/apps/web" -- run start -- --port=3000
            NODE_ENV=production pm2 describe truevine-admin > /dev/null && NODE_ENV=production pm2 reload truevine-admin --update-env || NODE_ENV=production pm2 start npm --name "truevine-admin" --cwd "/var/www/TruevineVoice/apps/admin" -- run start -- --port=3002
            
            pm2 save --force
            nginx -t && systemctl restart nginx
