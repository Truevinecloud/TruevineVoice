# Truevine Voice - local development infrastructure.
#
# Scope: databases and brokers only. Application processes (web, api, worker,
# admin) run on the host via npm during development so that hot reload and
# debugging behave normally.
#
# HOST PORTS
# ---------
# The *container* ports are fixed (PostgreSQL 5432, Redis 6379): they are
# internal to the Compose network and never change.
#
# The *host* ports are configurable through the root `.env` and default to
# 55432 / 56379 instead of the conventional 5432 / 6379. Developer machines
# routinely already run another project's PostgreSQL or Redis on the
# conventional ports, which makes `npm run infra:up` fail with "port is already
# allocated" - and a naive retry then leaves the application silently pointed at
# the *other* project's infrastructure.
#
# To change them, set POSTGRES_PORT / REDIS_PORT in `.env` AND update
# DATABASE_URL / REDIS_URL to the same ports. See `.env.example`.
#
# Usage:
#   npm run infra:up       # start PostgreSQL + Redis and wait for health
#   npm run infra:ps       # status
#   npm run infra:logs     # tail logs
#   npm run infra:down     # stop (keeps data)
#   npm run infra:reset    # stop and DELETE all development data

name: truevine-voice

services:
  postgres:
    image: postgres:18-alpine
    container_name: truevine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: truevine
      POSTGRES_PASSWORD: truevine
      POSTGRES_DB: truevine_voice
      # Deterministic collation for local development across hosts.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # HOST port is configurable (see header). CONTAINER port stays 5432.
      # Bound to loopback: local development infrastructure must not be
      # reachable from the local network.
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      # PostgreSQL 18 stores its data in a major-version-specific subdirectory.
      # The image requires a single mount at /var/lib/postgresql; mounting
      # /var/lib/postgresql/data makes it refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U truevine -d truevine_voice -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: truevine-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - '60'
      - '1'
    ports:
      # HOST port is configurable (see header). CONTAINER port stays 6379.
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
    name: truevine-postgres-data
  redis-data:
    name: truevine-redis-data
